name: jarvis_mobile
description: J.A.R.V.I.S. Mobile Companion — Stark Industries HUD

publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP + networking
  dio: ^5.4.3
  web_socket_channel: ^3.0.1

  # Voice I/O
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.0

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # Wake-on-LAN
  udp: ^4.0.0

  # Background processing
  workmanager: ^0.9.0

  # Device info (for FCM device_id)
  device_info_plus: ^10.1.0

  # URL launcher (Drive links)
  url_launcher: ^6.3.0

  # File picker (upload to JARVIS)
  file_picker: ^8.1.2

  # Permission handling
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Black.ttf
          weight: 800

  # No `assets:` block on purpose -- nothing in lib/ reads the Flutter asset
  # bundle (no rootBundle / DefaultAssetBundle / AssetManifest use anywhere).
  #  * The .ttf files above are bundled by the `fonts:` section; listing
  #    assets/fonts/ again under `assets:` only duplicated them as generic
  #    assets nobody loads.
  #  * assets/wake/ was declared for the wake-word ONNX model, but that model
  #    is read by the Android side -- WakeWordService.kt does
  #    assets.open("wake/hey_jarvis_v0.1.onnx"), which resolves against the
  #    Android AssetManager root (android/app/src/main/assets/wake/), not
  #    against flutter_assets/. A pubspec declaration can never satisfy it.
  #    See assets/ASSETS_SETUP.md.
  # Both entries were also permanently red in CI (asset_directory_does_not_exist)
  # because neither directory is tracked in git.
