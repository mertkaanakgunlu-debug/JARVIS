[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — Personal AI Assistant"
requires-python = ">=3.13"

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
