[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — Personal AI Assistant"
requires-python = ">=3.13"

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Faz F (WAV replay harness): voice_e2e tests drive real Silero VAD + real
# Whisper against a local model cache -- deliberately EXCLUDED from the
# normal/CI run (network-free, no model download, deterministic fake-STT
# tests only) and left for a manual/scheduled run with a model-cache
# strategy. addopts applies to every invocation; pass `-m voice_e2e`
# explicitly (which overrides addopts) to run only these.
markers = [
    "voice_e2e: real Silero VAD + real Whisper against a local model cache -- not run automatically, see docs/eval/acceptance_matrix.md's Faz F notes",
]
addopts = "-m 'not voice_e2e'"

# GPT-5.6 review remediation, Faz 7 (verdict #21): CI lint gate.
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pre-existing, deliberate exceptions -- not GPT-5.6 review findings, left
# as-is rather than scope-creeping this pass into unrelated cleanup:
#   E402 -- several modules import after a required setup step (e.g.
#           __main__.py's load_dotenv() before importing Settings-reading
#           modules; api.py's router imports after app/lifespan setup) --
#           deliberate ordering, not accidental.
#   F841 -- a handful of pre-existing "assigned but unused" locals where the
#           RHS's side effect (subprocess.run, ax.contour, getattr) is what
#           matters, not the binding.
ignore = ["E402", "F841"]
