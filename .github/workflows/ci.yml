name: CI

# GPT-5.6 review remediation, Faz 7 (verdict #21, CONFIRMED): no CI existed
# at all before this -- every change relied entirely on whoever wrote it
# running `pytest` locally. windows-latest, not ubuntu, because several
# direct dependencies (pywin32, winotify) are Windows-only -- this project
# runs on the owner's Windows PC by design (see CLAUDE.md), not a
# cross-platform target.

on:
  push:
    branches: [main, langgraph-migration]
  pull_request:
    branches: [main, langgraph-migration]

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Installs from the pinned lockfile (requirements-lock.txt), not
      # requirements.txt's ">=" ranges -- see that file's header for why.
      # ruff is pinned here (not in the lockfile, which is for runtime deps)
      # for the same reason electron's vitest got pinned in 0687772: an
      # unpinned dev-tool version drifted mid-project (0.15.21 -> 0.16.0
      # changed what rules apply with no explicit [tool.ruff.lint].select,
      # confirmed by reproducing the exact same 672 errors locally with
      # 0.16.0 against an otherwise-clean tree) and broke a previously-green
      # CI run with no code change of its own. Bump deliberately, not
      # silently, after checking what changed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install ruff==0.15.21

      # eval_oracle.py, manual_test_driver.py, ab_analyze.py,
      # ab_launch_server.py and alpha_gate.py (Faz 8) are the acceptance
      # instrument (scenario expectations + scoring + the A/B orchestration
      # + the alpha-gate verdict), so they're linted like first-class code.
      # NOT scripts/ wholesale: auth_setup.py has a pre-existing unrelated
      # F541.
      - name: Lint (ruff)
        run: ruff check jarvis/ tests/ scripts/eval_oracle.py scripts/manual_test_driver.py scripts/ab_analyze.py scripts/ab_launch_server.py scripts/alpha_gate.py

      - name: Test (pytest)
        run: pytest

  # Best-effort companion client -- not this project's Python core, and not
  # gated on by the python job above. continue-on-error so a mobile break
  # doesn't block a backend-only PR; still visible as a failed check.
  # (Electron below used to share this policy -- see that job's own comment
  # for why it was promoted to blocking, 2026-07-23.)
  mobile:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get
      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

  # Blocking, unlike mobile above (owner decision, 2026-07-23): Electron is
  # no longer just a best-effort companion client -- it renders the L3
  # confirmation prompt and completes the approve/deny round-trip (52d0b72),
  # making it part of the safety-critical confirmation path, and it's the
  # primary UI for the manual alpha acceptance pass (see CLAUDE.md/HANDOFF.md).
  # A parser regression, a failing vitest suite, or a broken build here can
  # silently reintroduce a confirmation bug or block the alpha pass itself --
  # that's no longer acceptable to let through as a non-blocking, easy-to-miss
  # check the way a purely cosmetic mobile lint warning is.
  electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron/package-lock.json
      - name: npm ci
        working-directory: electron
        run: npm ci
      # External-review finding (2026-07-23): chatStream.js (the shared SSE
      # parser for /chat/stream, /chat/upload, /chat/confirm/{id}) had zero
      # automated coverage -- a future refactor could silently reintroduce
      # the confirmation-frame-leaks-as-raw-JSON bug this session fixed.
      # This job is now blocking (see the job comment above), so a failure
      # here fails CI, same as the python job.
      - name: test (vitest)
        working-directory: electron
        run: npm test
      - name: build
        working-directory: electron
        run: npm run build
